<!DOCTYPE html>
<html lang="ko">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>日本語単語暗記</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #121212;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .screen {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }


        #mainScreen h1 {
            font-size: 40px;
            margin-bottom: 50px;
        }

        .main-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            width: 500px;
            margin: 0 auto;
            gap: 20px 35px;
       }

        .main-buttons button {
           width: 40px;
           height: 80px;
           padding: 0;
        }

        #studyWord {
            font-size: 100px;
            font-weight: bold;

            width: 100%;
            height: 140px;

            display: flex;
            justify-content: center;
            align-items: center;

            margin: 0;
        }

        #checkedScreen h1 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        #checkedCount {
            font-size: 18px;
            color: #f5f5f5;
            margin-bottom: 25px;
        }

        #checkedList {
            width: 100%;
            max-height: 55vh;
            overflow-y: auto;
            text-align: left;
            padding: 0 20px;
        }

        .checked-item {
            display: flex;
            align-items: baseline;
            gap: 18px;
            padding: 12px 5px;
            border-bottom: 1px solid #ddd;
        }

        .checked-kanji {
            font-size: 30px;
            font-weight: bold;
            min-width: 110px;
        }

        .checked-reading {
            font-size: 18px;
            color: #f5f5f5;
            min-width: 110px;
        }

        .checked-meaning {
            font-size: 18px;
        }

    #wordList {
        display: grid;
        grid-template-columns: repeat(3, 1Cr);
        gap: 10px;
        width: 100%;
        min-height: 600px;
        align-content: start;
    }

    .word-list-item {
        border: 1px solid #f5f5f5;
        padding: 12px;
        text-align: center;
    }

    .word-list-kanji {
        font-size: 24px;
    }

    .word-list-reading {
        font-size: 14px;
        margin-top: 5px;
    }

    button {
    padding: 8px 14px;
    font-size: 18px;

    border: none;
    border-radius: 0;

    background: transparent;
    color: inherit;

    cursor: pointer;
}

button:hover {
    opacity: 0.4;
}

        .bookmark-button:hover {
            color: #f5f5f5;
            border-color: #f5f5f5;
            background: #121212;
        }

        .delete-check-button {
            margin-left: auto;
            padding: 7px 12px;
            font-size: 14px;
            background: #121212;
            color: #f5f5f5;
        }

        .delete-check-button:hover {
            background: #f5f5f5;
            color: #121212;
        }


.study-buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    margin-top: 15px;
}

.study-buttons button {
    width: 42px;
    height: 42px;
    padding: 0;

    border: none;
    background: transparent;
    color: inherit;

    font-size: 22px;
    cursor: pointer;
}

.study-buttons button:hover {
    opacity: 0.5;
}

.study-buttons button,
.study-bottom-buttons button {
    border: none;
    background: none;
    color: inherit;
    box-shadow: none;
}

.study-buttons button:hover,
.study-bottom-buttons button:hover {
    opacity: 0.4;
}

        .word-list-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

#wordListPage {
    min-width: 60px;
}
        .home-button {
            margin-top: 60px;

            background: #121212;
        }


#studyScreen {
    position: relative;
    top: 50px;
    text-align: center;
    padding-top: 30px;
}

.study-word-area {
    position: relative;

    width: 100%;
    max-width: 700px;

    height: 140px;
    margin: 80px auto 10px;
}

#studyWord {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 400px;

    font-size: 48px;
    font-weight: 600;
    line-height: 1.2;

    text-align: center;
}

.study-prev {
    position: absolute;
    left: 0;
    top: 50%;
}

.study-next {
    position: absolute;
    right: 0;
    top: 50%;
}

.bookmark-button {
    position: absolute;

    top: -10px;
    right: 100px;

    width: 32px;
    height: 32px;

    padding: 0;

    border: none;
    background: none;

    font-size: 24px;
    line-height: 1;

    cursor: pointer;
}

.bookmark-button.active {
    font-size: 24px;
}

#studyReading {
    height: 32px;
    margin-top: 10px;

    font-size: 20px;
    line-height: 0;
}

#studyCount {
    margin-top: 12px;
    margin-bottom: 22px;

    font-size: 15px;
}

.study-bottom-buttons {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-top: -45px;
}

.study-bottom-buttons button {
    width: 42px;
    height: 42px;
    min-width: 42px;

    padding: 0;
    border: none;
    background: transparent;
    color: inherit;

    font-size: 22px;
    cursor: pointer;
}

.study-bottom-buttons button:hover {
    opacity: 0.5;

}

    }

    }

    }

    #checkedScreen h1 {

    }

    }

        font-size: 25px;

    }

        overflow-wrap: anywhere;
    }

    .checked-meaning {
        grid-column: 1;
    }

        grid-row: 1 / span 3;

        padding: 8px;
        font-size: 13px;
    }

    #groupScreen {
        margin-top: auto;

    <h1>日本語単語暗記</h1>

    <div class="main-buttons">

 <button onclick="openGroupSelect('study')">
    スタート
    </button>

    </div>

</div>


<div id="groupScreen" class="screen hidden">
    <h1 id="groupTitle">그룹 선택</h1>

<div class="main-buttons" id="groupButtons">
    <button onclick="selectGroup('1A')">1A</button>
    <button onclick="selectGroup('1B')">1B</button>
    <button onclick="selectGroup('1C')">1C</button>
    <button onclick="selectGroup('2A')">2A</button>
    <button onclick="selectGroup('2B')">2B</button>
    <button onclick="selectGroup('2C')">2C</button>
    <button onclick="selectGroup('2D')">2D</button>
    <button onclick="selectGroup('2F')">2F</button>
    <button onclick="selectGroup('1H')">1H</button>
    <button onclick="selectGroup('2H')">2H</button>
    <button onclick="selectGroup('1K')">1K</button>
    <button onclick="selectGroup('2K')">2K</button>
    <button onclick="selectGroup('S')">S</button>
    <button onclick="selectGroup('ALL')">∞</button>
</div>

    <button class="home-button" onclick="goHome()">
        ⌂
    </button>
</div>

<div id="wordListScreen" class="screen hidden">

    <h1 id="wordListTitle">≡</h1>

    <div id="wordList"></div>

    <div class="word-list-buttons">
        <button onclick="prevWordList()">≪</button>

        <div id="wordListPage">1 / 1</div>

        <button onclick="nextWordList()">≫</button>
    </div>

<button class="home-button" onclick="returnToStudy()">
    ☜
</button>

<button class="home-button" onclick="goHome()">
    ⌂
</button>

</div>


<div id="quizScreen" class="screen hidden">

    <div id="quizWord">
        -
    </div>

<div id="quizCount">
    0 / 0
</div>


<div class="quiz-buttons">

<button onclick="showQuizAnswerA()">♪</button>

</div>


    <div class="quiz-buttons">

        <button onclick="prevQuizWord()">
            ≪
        </button>

        <button onclick="nextQuizWord()">
            ≫
        </button>

    </div>


<button class="home-button" onclick="openGroupSelect('quiz')">
    ☜
</button>

<button class="home-button" onclick="goHome()">
    ⌂
</button>

<button class="home-button" onclick="openWordList()">
    ≡
</button>

</div>

<div id="studyScreen" class="screen hidden">

    <div class="study-word-area">

    <div id="studyReading">
    </div>

        <button
            id="studyBookmark"
            class="bookmark-button"
            type="button"
            onclick="toggleStudyCheck()"
            aria-label="현재 단어 체크"
            title="현재 단어 체크">
            ☆
        </button>

        <button
            class="study-nav study-prev"
            onclick="prevStudyWord()">
            ‹
        </button>

        <div id="studyWord">
            ▶︎
        </div>

        <button
            class="study-nav study-next"
            onclick="nextStudyWord()">
            ›
        </button>

    </div>

    <div id="studyMeaning">
    </div>

    <div id="studyCount">
        0 / 0
    </div>

    <div class="study-buttons">

    </div>

<div class="study-buttons">

    <button
        id="studyToggleButton"
        onclick="toggleStudy()">
        ▶︎
    </button>

    <button
        id="studyAnswerToggle"
        onclick="toggleStudyAnswer()">
        ♪
    </button>

    <button onclick="resetStudy()">
        ⚄
    </button>

    <button onclick="openCheckedWords()">
        ★
    </button>

    <button onclick="openWordList()">
        ≡
    </button>

</div>

    <div class="study-bottom-buttons">

        <button
            class="home-button"
            onclick="openGroupSelect('study')">
            ☜
        </button>

        <button
            class="home-button"
            onclick="goHome()">
            ⌂
        </button>

    </div>

</div>


<div id="checkedScreen" class="screen hidden">
    <h1>チェック</h1>

    <div id="checkedCount"></div>

    <div id="checkedList"></div>

    <button class="home-button" onclick="openStudy()">
        ☜
    </button>

    <button class="delete-all-button" onclick="clearAllCheckedWords()">
        リセット
    </button>

    <button class="home-button" onclick="goHome()">
        ⌂
    </button>
</div>

function goHome() {
    clearInterval(studyTimer);
    studyTimer = null;
    studyPlaying = false;

    hideAllScreens();
    document.getElementById("mainScreen").classList.remove("hidden");
}


let quizIndex = 0;
let quizWords = [];

function shuffle(array) {
    const result = [...array];

    for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
    }

    return result;
}

function openQuiz() {
    hideAllScreens();
    document.getElementById("quizScreen").classList.remove("hidden");

quizWords = words.filter(
    word => word.group === selectedGroup
);
    quizIndex = 0;

    showQuizWord();
}

function showQuizWord() {
    const word = quizWords[quizIndex];

    if (!word) return;

    document.getElementById("quizWord").textContent = word.kanji;
    document.getElementById("quizCount").textContent =
        (quizIndex + 1) + " / " + quizWords.length;
    document.getElementById("quizHint").textContent = "";
    document.getElementById("quizMeaning").textContent = "";
    }

function prevQuizWord() {
    quizIndex--;

    if (quizIndex < 0) {
        quizIndex = quizWords.length - 1;
    }

    showQuizWord();
}

function showQuizAnswerA() {
    const word = quizWords[quizIndex];

    if (!word) return;

    const hint = document.getElementById("quizHint");

    if (hint.textContent === "") {
        hint.textContent = word.yomigana;
    } else {
        hint.textContent = "";
    }
}

function nextQuizWord() {
    quizIndex++;

if (quizIndex >= quizWords.length) {
    quizIndex = 0;
}

    showQuizWord();
}


let checkedWords = JSON.parse(
    localStorage.getItem("checkedJapaneseWords") || "[]"
);

function isWordChecked(kanji) {
    return checkedWords.includes(kanji);
}

function saveCheckedWords() {
    localStorage.setItem(
        "checkedJapaneseWords",
        JSON.stringify(checkedWords)
    );
}

function getCurrentStudyWord() {
    if (!studyWords.length) return null;

    return studyWords[studyIndex] || null;
}

function updateStudyBookmark() {
    const button = document.getElementById("studyBookmark");
    const word = getCurrentStudyWord();

    if (!button) return;

    const active = word && isWordChecked(word.kanji);

    button.textContent = active ? "★" : "☆";
    button.classList.toggle("active", !!active);
    button.setAttribute(
        "aria-label",
        active ? "체크 해제" : "현재 단어 체크"
    );
    button.setAttribute(
        "title",
        active ? "체크 해제" : "현재 단어 체크"
    );
}

function toggleStudyCheck() {
    const word = getCurrentStudyWord();

    if (!word) return;

    clearInterval(studyTimer);
    studyTimer = null;
    studyPlaying = false;

    document.getElementById("studyToggleButton").textContent = "▶︎";

    if (isWordChecked(word.kanji)) {
        checkedWords = checkedWords.filter(
            kanji => kanji !== word.kanji
        );
    } else {
        checkedWords.push(word.kanji);
    }

    saveCheckedWords();
    updateStudyBookmark();
}

function openCheckedWords() {
    clearInterval(studyTimer);
    studyTimer = null;
    studyPlaying = false;

    hideAllScreens();
    document.getElementById("checkedScreen").classList.remove("hidden");

    renderCheckedWords();
}

function renderCheckedWords() {
    const list = document.getElementById("checkedList");
    const count = document.getElementById("checkedCount");

    const checked = words.filter(word =>
        checkedWords.includes(word.kanji)
    );

    count.textContent = `總 ${checked.length}個`;

    if (checked.length === 0) {
        list.innerHTML = "<p>(null)</p>";
        return;
    }

    list.innerHTML = "";

    checked.forEach(word => {
        const item = document.createElement("div");
        item.className = "checked-item";

        const kanji = document.createElement("div");
        kanji.className = "checked-kanji";
        kanji.textContent = word.kanji;

        const reading = document.createElement("div");
        reading.className = "checked-reading";
        reading.textContent = word.yomigana;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-check-button";
        deleteButton.textContent = "削除";
        deleteButton.title = "체크 해제";
        deleteButton.addEventListener("click", () => {
            removeCheckedWord(word.kanji);
        });

        item.appendChild(kanji);
        item.appendChild(reading);
        item.appendChild(deleteButton);

        list.appendChild(item);
    });
}

function removeCheckedWord(kanji) {
    checkedWords = checkedWords.filter(
        word => word !== kanji
    );

    saveCheckedWords();
    renderCheckedWords();
    updateStudyBookmark();
    clearInterval(studyTimer);
studyTimer = null;
studyPlaying = false;
}


let studyWords = [];
let studyIndex = 0;
let studyTimer = null;
let studyPlaying = false;
let selectedGroup = null;
let selectedMode = null;

let studyAnswerState = 0;

const STUDY_INTERVAL = 2000;

function openStudy() {
    hideAllScreens();
    document.getElementById("studyScreen").classList.remove("hidden");

    clearInterval(studyTimer);
    studyTimer = null;
    studyPlaying = false;

    studyAnswerState = 0;

    document.getElementById("studyToggleButton").textContent = "▶︎";
    document.getElementById("studyAnswerToggle").textContent = "♪";

    showStudyWord();
    updateStudyBookmark();
}

function showStudyWord() {
    const word = getCurrentStudyWord();

    if (!word) return;

    document.getElementById("studyWord").textContent =
        word.kanji;

    if (studyAnswerState >= 1) {
        document.getElementById("studyReading").textContent =
            word.yomigana;
    } else {
        document.getElementById("studyReading").textContent =
            "";
    }

    document.getElementById("studyCount").textContent =
        (studyIndex + 1) + " / " + studyWords.length;

    updateStudyBookmark();
}

function toggleStudyAnswer() {
    studyAnswerState++;

    if (studyAnswerState > 1) {
        studyAnswerState = 0;
    }

    const button =
        document.getElementById("studyAnswerToggle");

    if (studyAnswerState === 0) {
        button.textContent = "♪";
    } else {
        button.textContent = "⟲";
    }

    showStudyWord();
}

function prevStudyWord() {
    if (!studyWords.length) return;

    studyIndex--;

    if (studyIndex < 0) {
        studyIndex = studyWords.length - 1;
    }

    showStudyWord();
}

function nextStudyWord() {
    if (!studyWords.length) return;

    studyIndex++;

    if (studyIndex >= studyWords.length) {

        if (selectedGroup === "ALL") {
            studyWords = shuffle(words);
        } else {
            studyWords = shuffle(
                words.filter(
                    word => word.group === selectedGroup
                )
            );
        }

        studyIndex = 0;
    }

    showStudyWord();
}

function toggleStudy() {
    if (!studyWords.length) return;

    if (studyPlaying) {
        clearInterval(studyTimer);
        studyTimer = null;
        studyPlaying = false;

        document.getElementById("studyToggleButton").textContent = "▶︎";
    } else {
        showStudyWord();

        studyPlaying = true;

        clearInterval(studyTimer);

        studyTimer = setInterval(() => {
            nextStudyWord();
        }, STUDY_INTERVAL);
        document.getElementById("studyToggleButton").textContent = "❚❚";
    }
}

function resetStudy() {

    clearInterval(studyTimer);
    studyTimer = null;
    studyPlaying = false;

    if (selectedGroup === "ALL") {

        studyWords = shuffle(words);

    } else {

        studyWords = shuffle(
            words.filter(
                word => word.group === selectedGroup
            )
        );
    }

    studyIndex = 0;

    document
        .getElementById("studyToggleButton")
        .textContent = "▶︎";

    showStudyWord();
}

function clearAllCheckedWords() {
    checkedWords = [];

    saveCheckedWords();
    renderCheckedWords();
    updateStudyBookmark();
}

function openGroupSelect(mode) {
    selectedMode = mode;

    hideAllScreens();
    document.getElementById("groupScreen").classList.remove("hidden");

    if (mode === "study") {
        document.getElementById("groupTitle").textContent = "レベル";
    } else {
        document.getElementById("groupTitle").textContent = "≡";
    }
}

function openCategoryList(category) {
    selectedGroup = category;
    openWordList();
}

function selectGroup(group) {
    selectedGroup = group;

    if (selectedMode === "quiz") {
        openQuiz();
    } else if (selectedMode === "study") {
        studyWords = shuffle(
            selectedGroup === "ALL"
                ? words
                : words.filter(word => word.group === selectedGroup)
        );

        studyIndex = 0;
        openStudy();
    }
}

let wordListPage = 0;
const WORDS_PER_PAGE = 14;

function openWordList() {

    hideAllScreens();

    document
        .getElementById("wordListScreen")
        .classList.remove("hidden");

    wordListPage = 0;

    renderWordList();
}

function renderWordList() {

    const list =
        document.getElementById("wordList");

    const title =
        document.getElementById("wordListTitle");

    const groupWords =
        selectedGroup === "ALL"
            ? words
                : selectedGroup.length === 1
                ? words.filter(
                    word => word.group.startsWith(selectedGroup)
                )
                : words.filter(
                    word => word.group === selectedGroup
             );

    const start =
        wordListPage * WORDS_PER_PAGE;

    const pageWords =
        groupWords.slice(
            start,
            start + WORDS_PER_PAGE
        );

    const totalPages =
        Math.ceil(
            groupWords.length / WORDS_PER_PAGE
        );

    title.textContent =
        selectedGroup === "ALL"
            ? "リスト"
            : selectedGroup + " リスト";
        list.innerHTML = "";

        pageWords.forEach(word => {

        const item =
            document.createElement("div");

        item.className =
            "word-list-item";

        item.innerHTML =
            `<div class="word-list-kanji">
                ${word.kanji}
             </div>

             <div class="word-list-reading">
                ${word.yomigana}
             </div>`;

        list.appendChild(item);
    });

    document
        .getElementById("wordListPage")
        .textContent =
        (wordListPage + 1)
        + " / "
        + totalPages;
}


function prevWordList() {

    if (wordListPage > 0) {

        wordListPage--;

    } else {

        const groupWords =
            selectedGroup === "ALL"
                ? words
                : words.filter(
                    word => word.group === selectedGroup
                );

        const totalPages =
            Math.ceil(
                groupWords.length / WORDS_PER_PAGE
            );

        wordListPage = totalPages - 1;
    }

    renderWordList();
}


function nextWordList() {

    const groupWords =
        selectedGroup === "ALL"
            ? words
            : words.filter(
                word => word.group === selectedGroup
            );

    const totalPages =
        Math.ceil(
            groupWords.length / WORDS_PER_PAGE
        );

    if (wordListPage < totalPages - 1) {

        wordListPage++;

    } else {

        wordListPage = 0;
    }

    renderWordList();
}

function returnToStudy() {

    hideAllScreens();

    document
        .getElementById("studyScreen")
        .classList.remove("hidden");

    showStudyWord();

    updateStudyBookmark();
}

</script>
